# Render Blueprint for the Sentinel.AML FastAPI backend (Static CSV Architecture).
# No database service or DATABASE_URL required.

services:
  - type: web
    name: sentinel-aml-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: 'uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"'
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: https://prowar-rho.vercel.app
      - key: SELF_PING_ENABLED
        value: "True"
      - key: SELF_PING_INTERVAL_SECONDS
        value: "180"
      - key: CONTROL_API_TOKEN
        sync: false
